<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PathSnap Route Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font:16px system-ui;margin:0;color:#132238}header{padding:14px 20px;background:#102a43;color:white}main{padding:16px 20px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}input,select,button{font:inherit;padding:8px;border:1px solid #9fb3c8;border-radius:6px}button{background:#167d7f;color:white;border:0;cursor:pointer}#map{height:68vh;min-height:400px;border-radius:8px}.status{margin:10px 0}</style></head>
<body><header><b>PathSnap</b> · GPS Route Reconstruction</header><main><div class="controls"><label>API address <input id="api" value="" placeholder="Uses this page's server" size="28"></label><label>Trip <select id="trip"></select></label><button id="run">Reconstruct route</button></div><div id="status" class="status">Connecting to the model API...</div><div id="map"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let layers=[];
const api=()=>document.getElementById('api').value.trim().replace(/\/$/,'')||window.location.origin;
async function loadTrips(){const s=document.getElementById('status');try{let r=await fetch(api()+'/trips');if(!r.ok)throw Error(await r.text());let d=await r.json();document.getElementById('trip').innerHTML=d.trips.map(t=>`<option>${t}</option>`).join('');s.textContent=`Loaded ${d.trips.length} trips.`}catch(e){s.textContent='Could not reach API: '+e.message}}
document.getElementById('api').addEventListener('change',loadTrips);
document.getElementById('run').onclick=async()=>{const s=document.getElementById('status');s.textContent='Reconstructing…';try{let r=await fetch(api()+'/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trip_id:document.getElementById('trip').value})});let d=await r.json();if(!r.ok)throw Error(d.detail);layers.forEach(x=>map.removeLayer(x));layers=[];const gpsCoords=d.gps_coordinates.map(p=>[p[1],p[0]]);const routeCoords=d.predicted_route_coordinates.map(p=>[p[1],p[0]]);let route=L.polyline(routeCoords,{color:'#ef4444',weight:4,opacity:.8}).addTo(map);let gpsHalo=L.polyline(gpsCoords,{color:'#ffffff',weight:9,opacity:.95}).addTo(map);let gps=L.polyline(gpsCoords,{color:'#075bff',weight:5,opacity:1,dashArray:'7 7'}).addTo(map);let start=L.circleMarker(gpsCoords[0],{radius:6,color:'#ffffff',weight:2,fillColor:'#16a34a',fillOpacity:1}).addTo(map);let end=L.circleMarker(gpsCoords[gpsCoords.length-1],{radius:6,color:'#ffffff',weight:2,fillColor:'#7c3aed',fillOpacity:1}).addTo(map);gps.bringToFront();start.bringToFront();end.bringToFront();layers=[route,gpsHalo,gps,start,end];map.fitBounds(gps.getBounds());s.textContent=`${d.trip_id}: ${d.observations} observations`+(d.accuracy==null?'':` · accuracy ${(100*d.accuracy).toFixed(1)}% over ${d.scored_observations} scored points`)+'. Dashed blue with white outline: GPS · Red: predicted route · Green/purple dots: start/end.'}catch(e){s.textContent='Prediction failed: '+e.message}};
loadTrips();
</script></body></html>
